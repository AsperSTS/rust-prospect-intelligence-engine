name: Release macOS & Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precheck:
    name: Auditoría previa del repositorio y dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validar metadatos y coincidencia de versión
        id: meta
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          case "$VERSION" in
            ''|*[!0-9.]*) echo "Versión inválida en Cargo.toml: $VERSION" >&2; exit 1 ;;
          esac
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "El tag ($GITHUB_REF_NAME) no coincide con la versión de Cargo.toml (v$VERSION)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verificar higiene pública y guardia CI
        run: |
          ./scripts/verify-public-hygiene.sh --repo
          ./scripts/verify-public-hygiene.sh --ci-guard

      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Instalar cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Auditoría estricta cargo-deny
        run: cargo deny --locked check

      - name: Poblar índice Cargo bloqueado y verificar madurez de paquetes
        run: |
          cargo fetch --locked
          python3 scripts/verify_release_age.py --check

  build-macos:
    name: Build & Package macOS (arm64)
    needs: precheck
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Validar arquitectura Apple Silicon
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Se esperaba runner Apple Silicon (arm64); recibido: $(uname -m)" >&2
            exit 1
          fi

      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verificar formato, Clippy, guardia CI y pruebas
        run: |
          unset DENUE_TOKEN INEGI_TOKEN BANXICO_TOKEN
          ./scripts/verify-public-hygiene.sh --ci-guard
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

      - name: Preparar dependencias offline bloqueadas
        run: cargo fetch --locked

      - name: Compilar bundle macOS limpio (sin credenciales)
        run: |
          unset DENUE_TOKEN INEGI_TOKEN BANXICO_TOKEN
          ./scripts/bundle-macos.sh

      - name: Empaquetar instalador (.dmg) y app (.app.zip) macOS
        run: |
          VERSION="${{ needs.precheck.outputs.version }}"
          mkdir -p release-assets
          DMG_STAGE=$(mktemp -d)
          trap 'rm -rf "$DMG_STAGE"' EXIT
          /usr/bin/ditto "dist/Prospect Intelligence.app" "$DMG_STAGE/Prospect Intelligence.app"
          ln -s /Applications "$DMG_STAGE/Applications"
          DMG_PATH="release-assets/Prospect-Intelligence-${VERSION}-macOS-arm64.dmg"
          ZIP_PATH="release-assets/Prospect-Intelligence-${VERSION}-macOS-arm64.app.zip"
          rm -f "$DMG_PATH" "$ZIP_PATH"
          for attempt in 1 2 3; do
            rm -f "$DMG_PATH"
            if /usr/bin/hdiutil create \
              -volname "Prospect Intelligence" \
              -srcfolder "$DMG_STAGE" \
              -fs HFS+ \
              -ov -format UDZO \
              "$DMG_PATH"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 3
          done
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "dist/Prospect Intelligence.app" \
            "$ZIP_PATH"
          sync
          sleep 2

      - name: Auditoría estricta de artefactos macOS y humo CLI aislado
        run: |
          ./scripts/verify-public-hygiene.sh --dist
          /usr/bin/otool -L "dist/Prospect Intelligence.app/Contents/MacOS/ProspectIntelligence"
          if /usr/bin/otool -L "dist/Prospect Intelligence.app/Contents/MacOS/ProspectIntelligence" | grep -E '/Users/|/opt/homebrew/|/usr/local/' >/dev/null; then
            echo "Error: se detectaron dependencias dinámicas no portables en el binario." >&2
            exit 1
          fi
          TMP_HOME=$(mktemp -d)
          trap 'rm -rf "$TMP_HOME"' EXIT
          PROSPECTOS_HOME="$TMP_HOME" dist/prospectos inspect

      - name: Subir artefactos macOS
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-macos
          path: release-assets/
          retention-days: 14

  build-windows:
    name: Build & Package Windows (x64)
    needs: precheck
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verificar formato, Clippy, guardia CI y pruebas en Windows
        shell: bash
        run: |
          unset DENUE_TOKEN INEGI_TOKEN BANXICO_TOKEN
          ./scripts/verify-public-hygiene.sh --ci-guard
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

      - name: Compilar binarios Windows limpios (sin credenciales)
        shell: bash
        run: |
          unset DENUE_TOKEN INEGI_TOKEN BANXICO_TOKEN
          ./scripts/bundle-windows.sh

      - name: Prueba de humo CLI en PROSPECTOS_HOME aislado
        shell: bash
        run: |
          TMP_HOME=$(mktemp -d)
          trap 'rm -rf "$TMP_HOME"' EXIT
          PROSPECTOS_HOME="$TMP_HOME" ./dist/windows/cli/prospectos.exe inspect

      - name: Preparar ejecutable GUI Windows (.exe) y verificar higiene
        shell: bash
        run: |
          VERSION="${{ needs.precheck.outputs.version }}"
          if find dist/windows/app -type f | grep -iE '(^|/)(credentials\.env|\.env(\..*)?|prospectos\.db|settings\.json|templates\.toml|AGENTS\.md)$|\.(db|db-wal|db-shm|sqlite|sqlite3|xlsx|csv)$' >/dev/null; then
            echo "Error: se encontraron archivos prohibidos en dist/windows/app." >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "dist/windows/app/ProspectIntelligence.exe" "release-assets/Prospect-Intelligence-${VERSION}-Windows-x64.exe"
          ./scripts/verify-public-hygiene.sh --archives

      - name: Subir artefactos Windows
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-windows
          path: release-assets/
          retention-days: 14

  publish-release:
    name: Publicar GitHub Release multiplataforma
    needs: [precheck, build-macos, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Descargar artefactos compilados
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Verificar higiene de archivos y calcular SHA-256
        run: |
          ./scripts/verify-public-hygiene.sh --archives
          (
            cd release-assets
            sha256sum *.dmg *.zip *.exe > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Subir suma de verificación combinada
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-combined-${{ needs.precheck.outputs.version }}
          path: release-assets/
          retention-days: 14

      - name: Crear GitHub Release público
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.precheck.outputs.version }}"
          cat > release-notes.md <<NOTES
          ## Prospect Intelligence ${VERSION}

          Descarga directa para escritorio, sin bases de datos ni tokens incluidos (al abrir por primera vez configuras tus claves gratuitas de INEGI y Banxico desde la app).

          - **macOS (Apple Silicon):** elige \`Prospect-Intelligence-${VERSION}-macOS-arm64.dmg\` (instalador visual para arrastrar a **Aplicaciones**) o \`Prospect-Intelligence-${VERSION}-macOS-arm64.app.zip\` (\`.app\` lista para descomprimir). La primera vez ábrela con clic derecho → **Abrir** (o desde **Ajustes del Sistema → Privacidad y seguridad**).
          - **Windows (x64, experimental):** \`Prospect-Intelligence-${VERSION}-Windows-x64.exe\` — ejecutable directo (requiere WebView2 Runtime, incluido en Windows 11). Si aparece SmartScreen, elige **Más información → Ejecutar de todas formas**.
          - **Verificación:** \`SHA256SUMS.txt\`
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/Prospect-Intelligence-${VERSION}-macOS-arm64.dmg" \
            "release-assets/Prospect-Intelligence-${VERSION}-macOS-arm64.app.zip" \
            "release-assets/Prospect-Intelligence-${VERSION}-Windows-x64.exe" \
            "release-assets/SHA256SUMS.txt" \
            --verify-tag \
            --title "Prospect Intelligence v${VERSION}" \
            --notes-file release-notes.md

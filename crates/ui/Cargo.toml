[package]
name = "prospect-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dependencies]
prospect-core = { version = "=0.2.1", path = "../core" }
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "document"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "time"] }
webbrowser = "=1.2.4"

[target.'cfg(not(target_os = "ios"))'.dependencies]
arboard = { version = "=3.6.1", default-features = false }
opener = "=0.9.0"

[dev-dependencies]
dioxus-ssr = "=0.7.10"
tempfile = "=3.27.0"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSString", "NSURL", "NSSet"] }
objc2-ui-kit = { version = "=0.3.2", default-features = false, features = ["std", "UIPasteboard", "UIApplication", "UIResponder", "UIScene", "UISceneOptions", "UIWindowScene", "UIWindow", "UIView", "UIInterface", "UIViewController", "UILayoutGuide", "UIKeyboardLayoutGuide", "UITrackingLayoutGuide", "UIGeometry", "UIScrollView", "block2"] }

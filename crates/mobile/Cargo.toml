[package]
name = "prospect-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
embedded-tokens = ["prospect-core/embedded-tokens"]

[dependencies]
prospect-core = { version = "=0.2.1", path = "../core" }
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "mobile", "document"] }
prospect-ui = { version = "=0.2.1", path = "../ui", features = ["mobile"] }

[package]
name = "prospect-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
embedded-tokens = []

[dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
csv = "=1.4.0"
dirs = "=7.0.0"
futures-util = "=0.3.34"
html-escape = "=0.2.15"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "rustls", "query"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "backup", "functions"] }
rust_xlsxwriter = "=0.100.0"
scraper = "=0.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.10.7"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = "=0.7.19"
toml = "=0.9.8"
unicode-normalization = "=0.1.25"
unicode_categories = "=0.1.1"
url = "=2.5.8"
zip = { version = "=9.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.27.0"

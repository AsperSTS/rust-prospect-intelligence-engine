[package]
name = "prospect-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
prospect-core = { version = "=0.2.1", path = "../core" }
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "desktop"] }
arboard = { version = "=3.6.1", default-features = false }
opener = "=0.9.0"
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
dioxus-ssr = "=0.7.10"

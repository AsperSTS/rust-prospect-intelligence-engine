# Plantillas editables. El código las lee tal cual (se recargan al guardar el archivo).
# Variables permitidas: {nombre} {giro_corto} {cosa} {pregunta} {ejemplo} {obs} {credencial}
# Constantes del remitente (config.py): {owner} {owner_corto} {whatsapp}
# Reglas (se validan automáticamente): WhatsApp ≤ 65 palabras y 1 pregunta · correo ≤ 120 palabras · sin frases prohibidas.
# {obs} solo se usa si el sitio de la empresa lo respalda con evidencia; si no hay evidencia, la variante C no se asigna.

[whatsapp]
# A — puerta de entrada: no sabemos quién decide
A = "Hola, buen día. Soy {owner}. Vi que {nombre} trabaja en {giro_corto}. Trabajo con digitalización y automatización de procesos. ¿Quién lleva actualmente {cosa} con ustedes?"
# B — pregunta directa: empresa bien identificada, sin evidencia web específica
B = "Hola, buen día. Soy {owner}. Desarrollo herramientas para procesos internos. Vi a {nombre} y me surgió una duda: {pregunta}"
# C — evidencia contextual: solo con {obs} real
C = "Hola, buen día. Soy {owner_corto}. {obs} Trabajo con digitalización de procesos y me surgió una duda al verlo: {pregunta}"
# D — credencial: cuando Audi aporta confianza al segmento
D = "Hola, buen día. Soy {owner}. {credencial} Actualmente desarrollo soluciones para procesos internos. Estuve revisando a {nombre} y me surgió una pregunta: {pregunta}"

[email]
asunto_A = "Consulta sobre {cosa} en {nombre}"
asunto_B = "Pregunta sobre {cosa}"
cuerpo_con_credencial = """Buen día,

Soy {owner}. {credencial} Actualmente desarrollo soluciones para procesos internos.

Estuve revisando a {nombre} y me surgió una pregunta sobre {cosa}:

{pregunta}

Si es un proceso que hoy requiere bastante trabajo manual, puedo mostrarles un ejemplo sencillo de cómo podría resolverse. Si este tema lo lleva otra persona, ¿me podría indicar con quién revisarlo?

Saludos,
{owner}
WhatsApp: {whatsapp}"""
cuerpo_sin_credencial = """Buen día,

Soy {owner}. Desarrollo herramientas de software y automatización para procesos internos.

Estuve revisando a {nombre} y me surgió una pregunta sobre {cosa}:

{pregunta}

Si tiene sentido para ustedes, puedo mostrarles un ejemplo sencillo aplicado a ese proceso. Si este tema lo lleva otra persona, ¿me podría indicar con quién revisarlo?

Saludos,
{owner}
WhatsApp: {whatsapp}"""

[seguimiento]
# D+3 — volver concreto
d3 = """Hola nuevamente. Pensando en lo que les comentaba, un ejemplo para su caso podría ser {ejemplo}.

Si les sirve, puedo mostrarles cómo se vería sin necesidad de cambiar de entrada las herramientas que ya usan."""
# D+7 — reducir fricción
d7 = """Buen día. La idea no sería cambiar todo su proceso, sino entender primero cómo llevan hoy {cosa} y ver si hay alguna parte que realmente valga la pena simplificar.

Si le sirve, puedo explicarle el ejemplo por aquí mismo."""
# D+14 — cierre limpio
d14 = """Buen día. Cierro el tema por aquí.

Si más adelante quieren revisar {cosa} o algún proceso que esté consumiendo trabajo manual, con gusto puedo ayudarles.

Saludos,
{owner_corto}"""

# Texto por giro. Preguntas abiertas: no presuponen que trabajan mal.
[giros."Autopartes"]
cosa = "reportes de producción y calidad"
pregunta = "¿Cómo concentran hoy la información de producción y calidad para sus reportes?"
ejemplo = "un tablero de producción, paros y scrap alimentado desde sus registros actuales"

[giros."Equipo de transporte"]
cosa = "seguimiento de órdenes y producción"
pregunta = "¿Cómo hacen seguimiento al avance de cada orden desde que entra hasta que termina producción?"
ejemplo = "una vista de órdenes abiertas, etapa actual y responsables"

[giros."Metalmecánica"]
cosa = "cotizaciones, órdenes y costos"
pregunta = "¿Cómo controlan actualmente cotizaciones, órdenes de trabajo y costos de cada trabajo?"
ejemplo = "un control sencillo de órdenes con etapa, materiales y costo acumulado"

[giros."Manufactura"]
cosa = "producción e inventario"
pregunta = "¿Cómo generan actualmente sus reportes de producción e inventario?"
ejemplo = "un reporte de producción e inventario generado desde las mismas fuentes que ya usan"

[giros."Comercializadora B2B"]
cosa = "pedidos e inventario"
pregunta = "¿Cómo conectan actualmente pedidos, existencias y seguimiento al cliente?"
ejemplo = "una vista única de pedidos, estatus y existencias"

[giros."Transporte"]
cosa = "viajes y costos por unidad"
pregunta = "¿Cómo llevan el control de viajes, gastos y rentabilidad por unidad?"
ejemplo = "un tablero de viajes, gastos y mantenimiento por unidad"

[giros."Logística"]
cosa = "entregas y costos por ruta"
pregunta = "¿Cómo concentran el estado de las entregas y los costos de cada ruta?"
ejemplo = "un tablero de entregas, incidencias y costo por ruta"

[giros."Almacén"]
cosa = "entradas, salidas y existencias"
pregunta = "¿Cómo registran actualmente entradas, salidas y existencias?"
ejemplo = "un control de movimientos y existencias en una sola vista"

[giros."Constructora / contratista"]
cosa = "costos de obra y compras"
pregunta = "¿Cómo comparan durante la obra lo gastado contra el presupuesto?"
ejemplo = "un tablero de costos reales contra presupuesto por obra"

[giros."Taller industrial"]
cosa = "órdenes y refacciones"
pregunta = "¿Cómo llevan el seguimiento de las órdenes desde que entran hasta que se entregan?"
ejemplo = "un control de órdenes, estatus y refacciones asociadas"

[giros."Otro"]
cosa = "reportes o procesos repetitivos"
pregunta = "¿Hay algún reporte o proceso operativo que hoy requiera capturar o consolidar información manualmente?"
ejemplo = "una automatización construida sobre los archivos y herramientas que ya usan"

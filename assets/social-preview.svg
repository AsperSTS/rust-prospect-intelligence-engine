  <text x="90" y="316" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="60" font-weight="700" fill="#93E1C5" letter-spacing="-1">Intelligence</text>

  <!-- Subtítulo exacto solicitado -->
  <text x="90" y="378" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="22.5" fill="#CBD5E1">Prospección local con datos públicos</text>
  <text x="90" y="410" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="22.5" fill="#CBD5E1">del INEGI, con scoring y CRM integrado.</text>


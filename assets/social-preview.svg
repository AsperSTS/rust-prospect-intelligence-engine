<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1820"/>
      <stop offset="55%" stop-color="#102632"/>
      <stop offset="100%" stop-color="#0C1E27"/>
    </linearGradient>
    <radialGradient id="glow" cx="950" cy="320" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#65CDB1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#65CDB1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#234A57"/>
      <stop offset="55%" stop-color="#142F3B"/>
      <stop offset="100%" stop-color="#10242F"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B6F3D9"/>
      <stop offset="100%" stop-color="#65CDB1"/>

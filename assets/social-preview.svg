      <rect x="4" y="4" width="824" height="824" rx="180" fill="none" stroke="#547F88" stroke-opacity="0.65" stroke-width="10"/>
      <path d="M500 490 L658 648" fill="none" stroke="url(#mint)" stroke-width="76" stroke-linecap="round"/>
      <circle cx="356" cy="346" r="174" fill="none" stroke="url(#mint)" stroke-width="62"/>
      <rect x="246" y="346" width="48" height="88" rx="16" fill="#73D2B5"/>

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is an archived compile-time macro dependency of Dioxus Desktop image decoders. No vulnerability is alleged in this advisory; version remains locked. Review replacement in the post-migration dependency audit; do not add it as a direct application dependency." },
]
